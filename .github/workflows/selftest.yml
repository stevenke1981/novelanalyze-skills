name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  novel-characters:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run deterministic self-test
        run: node skills/novel-characters/scripts/selftest.mjs
      - name: Run comic self-test
        run: node skills/novel-characters/scripts/comic-selftest.mjs
      - name: Run live-action self-test
        run: node skills/novel-characters/scripts/live-action-selftest.mjs
      - name: Run deterministic evals
        run: node evals/eval.mjs
      - name: Validate bundled fixture
        run: node skills/novel-characters/scripts/novel-characters.mjs validate skills/novel-characters/examples/渡口-cast.json skills/novel-characters/examples/渡口.txt
      - name: Validate comic fixture
        run: node skills/novel-characters/scripts/comic-image-set.mjs validate skills/novel-characters/examples/渡口-comic.json skills/novel-characters/examples/渡口-cast.json
      - name: Validate live-action fixture
        run: node skills/novel-characters/scripts/live-action-image-set.mjs validate skills/novel-characters/examples/渡口-live-action.json skills/novel-characters/examples/渡口-cast.json
      - name: Render comic fixture
        shell: bash
        run: node skills/novel-characters/scripts/comic-image-set.mjs render skills/novel-characters/examples/渡口-comic.json --md > comic-fixture.md
      - name: Render live-action fixture
        shell: bash
        run: node skills/novel-characters/scripts/live-action-image-set.mjs render skills/novel-characters/examples/渡口-live-action.json --md > live-action-fixture.md
      - name: Render HTML fixture
        shell: bash
        run: node skills/novel-characters/scripts/novel-characters.mjs render skills/novel-characters/examples/渡口-cast.json --html > report-fixture.html
      - name: Test PowerShell installer
        if: runner.os == 'Windows' && matrix.node == 22
        shell: pwsh
        run: .\scripts\install.ps1 -Codex -OpenCode
      - name: Test Bash installer
        if: runner.os != 'Windows' && matrix.node == 22
        shell: bash
        run: bash scripts/install.sh --codex --opencode
